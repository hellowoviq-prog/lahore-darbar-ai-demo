<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Lahore Darbar AI Assistant</title>
  <meta name="description" content="Lahore Darbar AI Ordering Assistant">

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      background: #fff;
    }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #e9e9e9;
      background: #fff;
      position: relative;
      z-index: 5;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3e8;
      border: 1px solid #ece4cf;
      font-weight: 800;
      color: #8b6b1f;
      font-size: 18px;
    }
    .brand-text { min-width: 0; }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #181818;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle {
      font-size: 12px;
      color: #777;
      margin-top: 2px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #555;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1fa463;
    }
    #chat-shell {
      position: relative;
      width: 100%;
      height: calc(100% - 64px);
      background: #fff;
    }
    .bpFab { display: none !important; }
    .bpWebchat {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    @media (max-width: 640px) {
      .topbar { height: 56px; padding: 0 14px; }
      #chat-shell { height: calc(100% - 56px); }
      .mark { width: 34px; height: 34px; }
      .status { display: none; }
    }
  </style>

  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
  <script>
    window.botpress.on('webchat:initialized', () => {
      setTimeout(() => window.botpress.open(), 250);
    });
  </script>
  <script src="https://files.bpcontent.cloud/2026/09/12/19/20260912192409-98RCQVZG.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">LD</div>
      <div class="brand-text">
        <div class="title">Lahore Darbar AI Assistant</div>
        <div class="subtitle">Menu • Recommendations • Order assistance</div>
      </div>
    </div>
    <div class="status"><span class="dot"></span> Online</div>
  </header>

  <main id="chat-shell"></main>
</body>
</html>
